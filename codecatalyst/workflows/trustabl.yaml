Name: Trustabl
SchemaVersion: "1.0"

# Trustabl — Amazon CodeCatalyst workflow.
#
# Runs the trustabl scanner over WorkflowSource on every push to main and gates
# the run on risk/severity. Vendor the plugin's `scan/` directory into your repo
# (this action runs `scan/trustabl-scan.sh` from the source checkout).

Triggers:
  - Type: PUSH
    Branches:
      - main

Actions:
  Trustabl_Scan:
    Identifier: aws/build@v1
    Inputs:
      Sources:
        - WorkflowSource
      Variables:
        - Name: TARGET
          Value: "."
        - Name: VERSION
          Value: "latest"
        - Name: SEVERITY_THRESHOLD
          Value: "none"
        - Name: RISK_SCORE_THRESHOLD
          Value: "0"
        - Name: REPORT_ONLY
          Value: "false"
        - Name: SECURITY_HUB
          Value: "false"
    Configuration:
      Steps:
        - Run: bash scan/trustabl-scan.sh
    Outputs:
      # Auto-discovery defaults to Enabled: true and inspects every file the
      # action generates, so leaving it on would report trustabl.sarif a second
      # time alongside the manual report below.
      AutoDiscoverReports:
        Enabled: false
      Artifacts:
        - Name: trustabl-results
          Files:
            - trustabl.json
            - trustabl.sarif
            - trustabl-summary.md
            - trustabl.env
            - trustabl.asff.json
      # Surfaces findings in the CodeCatalyst Reports tab.
      # SARIFSCA is the only SARIF value CodeCatalyst accepts in the YAML editor
      # ("For SARIF, specify SARIF (visual editor) or SARIFSCA (YAML editor)").
      # https://docs.aws.amazon.com/codecatalyst/latest/userguide/build-action-ref.html
      Reports:
        trustabl-sarif:
          Format: SARIFSCA
          IncludePaths:
            - trustabl.sarif
