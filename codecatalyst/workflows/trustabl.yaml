Name: Trustabl
SchemaVersion: "1.0"

# Trustabl — Amazon CodeCatalyst workflow.
#
# Runs the trustabl scanner over WorkflowSource on every push to main and gates
# the run on risk/severity. Vendor the plugin's `scan/` directory into your repo
# (this action runs `scan/trustabl-scan.sh` from the source checkout).

Triggers:
  - Type: PUSH
    Branches:
      - main

Actions:
  Trustabl_Scan:
    Identifier: aws/build@v1
    Inputs:
      Sources:
        - WorkflowSource
      Variables:
        - Name: TARGET
          Value: "."
        - Name: VERSION
          Value: "latest"
        - Name: SEVERITY_THRESHOLD
          Value: "none"
        - Name: RISK_SCORE_THRESHOLD
          Value: "0"
    Configuration:
      Steps:
        - Run: bash scan/trustabl-scan.sh
    Outputs:
      Artifacts:
        - Name: trustabl-results
          Files:
            - trustabl.json
            - trustabl.sarif
            - trustabl-summary.md
      # Surfaces findings in the CodeCatalyst Reports tab.
      #
      # SARIFSA, not SARIFSCA. CodeCatalyst offers SARIF under two report types:
      # SARIFSA for static analysis and SARIFSCA for software composition
      # analysis. trustabl is a static analyzer over agent source, so its
      # findings belong in the static-analysis report — SCA is the
      # dependency/vulnerability report type, which this workflow does not
      # produce (the scanner does not pass --vuln-scan).
      # https://docs.aws.amazon.com/codecatalyst/latest/userguide/test.sarif.html
      Reports:
        trustabl-sarif:
          Format: SARIFSA
          IncludePaths:
            - trustabl.sarif
